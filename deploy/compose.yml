# Production stack. Lives on the VPS next to its `.env` (see .env.example);
# the deploy workflow uploads this directory and sets the image tag in images.env.
name: eth-watch-bot

# Optional local Postgres with daily backups (COMPOSE_PROFILES=postgres): the services
# `postgres` and `postgres-backup` from dirai-kit's fragment, which the deploy workflow
# uploads next to this file. postgres.env keeps the names of the first deploys: user and
# database eth_watch, dumps eth-watch-*.dump. Set POSTGRES_PASSWORD in .env, and
# DATABASE_URL=postgres://eth_watch:<POSTGRES_PASSWORD>@postgres:5432/eth_watch
include:
  - path: postgres.compose.yml
    env_file: [.env, postgres.env]

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  bot:
    image: ${IMAGE_REGISTRY:?set IMAGE_REGISTRY}/eth-watch-bot:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: '3000'
    depends_on:
      # Only with the postgres profile; an external database needs no waiting
      postgres:
        condition: service_healthy
        required: false
    logging: *logging

  # Optional HTTPS entry (COMPOSE_PROFILES=web): Telegram webhook and GET /v1/messages.
  # Polling bots without a public API do not need it.
  caddy:
    image: caddy:2.11.7-alpine
    profiles: [web]
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - bot
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
