# Production stack. Lives on the VPS next to its `.env` (see .env.example);
# the deploy workflow uploads this directory and sets the image tag in images.env.
name: eth-watch-bot

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  bot:
    image: ${IMAGE_REGISTRY:?set IMAGE_REGISTRY}/eth-watch-bot:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: '3000'
    depends_on:
      # Only with the postgres profile; an external database needs no waiting
      postgres:
        condition: service_healthy
        required: false
    logging: *logging

  # Optional HTTPS entry (COMPOSE_PROFILES=web): Telegram webhook and GET /v1/messages.
  # Polling bots without a public API do not need it.
  caddy:
    image: caddy:2.11.7-alpine
    profiles: [web]
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - bot
    logging: *logging

  # Optional local Postgres (COMPOSE_PROFILES=postgres): set POSTGRES_PASSWORD, and
  # DATABASE_URL=postgres://eth_watch:<POSTGRES_PASSWORD>@postgres:5432/eth_watch
  postgres:
    image: postgres:${POSTGRES_VERSION:-18.6-alpine}
    profiles: [postgres]
    restart: unless-stopped
    environment:
      POSTGRES_USER: eth_watch
      POSTGRES_DB: eth_watch
      # The image refuses to start without it
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      # Postgres 18 keeps its data under /var/lib/postgresql/<version>
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'eth_watch', '-d', 'eth_watch']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s
    logging: *logging

  # Daily dump of the database to ./backups, keeps BACKUP_KEEP_DAYS
  postgres-backup:
    image: postgres:${POSTGRES_VERSION:-18.6-alpine}
    profiles: [postgres]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      PGHOST: postgres
      PGUSER: eth_watch
      PGDATABASE: eth_watch
      PGPASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - ./backups:/backup
    entrypoint:
      - /bin/sh
      - -c
      - |
        while true; do
          file="/backup/eth-watch-$$(date -u +%Y%m%dT%H%M%SZ).dump"
          if pg_dump --format=custom --file="$$file"; then
            echo "backup written: $$file"
            wait=86400
          else
            rm -f "$$file"
            # e.g. Postgres restarting: try again soon instead of in a day
            echo "backup failed, retrying in 5 minutes" >&2
            wait=300
          fi
          find /backup -name 'eth-watch-*.dump' -mtime +"$$BACKUP_KEEP_DAYS" -delete
          sleep "$$wait"
        done
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
