name: Deploy

# Runs after CI passes on main, so a broken commit is never built or deployed
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # The shared workflow builds the image, uploads deploy/ with the Postgres fragment and
  # restarts the stack. Without the DEPLOY_PATH repository variable only the image is
  # built (see deploy/README.md).
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: write
    uses: DiRaiks/dirai-kit/.github/workflows/deploy.yml@aa9060fca5620c6ca848e6b93a7b311fe914d964 # main
    with:
      # The commit CI tested; a manual run deploys the commit it was started on
      commit: ${{ github.event.workflow_run.head_sha || github.sha }}
      images: '[{"name": "eth-watch-bot", "dockerfile": "Dockerfile"}]'
      services: bot
      deploy-path: ${{ vars.DEPLOY_PATH }}
    secrets: inherit
