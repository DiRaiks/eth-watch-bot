# Dependency updates: every ecosystem below goes into one weekly PR (multi-ecosystem
# group). Versions younger than a week are skipped (cooldown); security updates
# come at once, in their own PRs.
version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Moscow
    commit-message:
      prefix: chore
      include: scope

updates:
  # npm: the root package-lock.json
  - package-ecosystem: npm
    directory: /
    patterns: ['*']
    multi-ecosystem-group: dependencies
    versioning-strategy: increase
    cooldown:
      default-days: 7
    ignore:
      # TypeScript 7 waits for typescript-eslint support
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Types follow the Node LTS the services run on, not the newest Node
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    patterns: ['*']
    multi-ecosystem-group: dependencies
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directories: ['/']
    patterns: ['*']
    multi-ecosystem-group: dependencies
    cooldown:
      default-days: 7
    ignore:
      # Node LTS only: moving to the next one is a deliberate upgrade. By versions, as
      # Dependabot does not count 24-alpine → 25-alpine as a major update
      - dependency-name: node
        versions: ['>=25']

  - package-ecosystem: docker-compose
    directory: /deploy
    patterns: ['*']
    multi-ecosystem-group: dependencies
    cooldown:
      default-days: 7
    ignore:
      # A new Postgres major needs a dump and restore of the data
      - dependency-name: postgres
        versions: ['>=19']
